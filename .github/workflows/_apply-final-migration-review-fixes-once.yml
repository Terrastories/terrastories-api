name: Apply final migration review fixes once

on:
  push:
    branches:
      - feat/rails-to-v2-migration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rails-to-v2-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Use a null-prototype manifest table record
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/migration/rails/capture.ts')
          text = path.read_text()
          old = "    const manifestTables: RailsCaptureManifest['tables'] = {};"
          new = "    const manifestTables = Object.create(null) as RailsCaptureManifest['tables'];"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one manifest table initializer, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: npx prettier --write src/migration/rails/capture.ts src/migration/rails/active-storage.ts tests/migration/rails-contract.test.ts tests/migration/rails-capture.integration.test.ts
      - name: Commit final review fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/migration/rails/capture.ts src/migration/rails/active-storage.ts tests/migration/rails-contract.test.ts tests/migration/rails-capture.integration.test.ts
          git commit -m 'fix: close custom capture path and key edge cases'
          git push origin HEAD:feat/rails-to-v2-migration

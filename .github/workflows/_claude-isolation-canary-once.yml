name: Claude isolated review handoff canary once

on:
  push:
    branches:
      - ops/mark-163-164-ready

permissions:
  contents: read

jobs:
  prepare-packet:
    runs-on: ubuntu-latest
    outputs:
      packet_sha256: ${{ steps.packet.outputs.packet_sha256 }}
    steps:
      - name: Build packet
        id: packet
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/claude-review-packet"
          mkdir -p "$dir"
          cat > "$dir/review-prompt.md" <<'EOF'
          Authentication/model/isolation canary only.
          Return verdict NO_BLOCKER_OR_SHOULD_FIX and review_markdown AUTH_OK.
          Do not use tools.
          EOF
          digest="$(sha256sum "$dir/review-prompt.md" | awk '{print $1}')"
          echo "packet_file=$dir/review-prompt.md" >> "$GITHUB_OUTPUT"
          echo "packet_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Upload packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-packet-${{ github.run_id }}
          path: ${{ steps.packet.outputs.packet_file }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  claude-review:
    needs: prepare-packet
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download packet on fresh runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-review-packet-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-review-packet
          digest-mismatch: error
      - name: Verify packet and runtime
        id: packet
        env:
          EXPECTED_PACKET_SHA256: ${{ needs.prepare-packet.outputs.packet_sha256 }}
        run: |
          set -euo pipefail
          packet="${RUNNER_TEMP}/claude-review-packet/review-prompt.md"
          test "$(sha256sum "$packet" | awk '{print $1}')" = "$EXPECTED_PACKET_SHA256"
          runtime="${RUNNER_TEMP}/claude-runtime"
          mkdir -p "$runtime"
          echo "prompt_file=$packet" >> "$GITHUB_OUTPUT"
          echo "runtime_dir=$runtime" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - name: Install exact Claude runtime from clean npm configuration
        id: cli
        env:
          DISABLE_UPDATES: '1'
          DISABLE_AUTOUPDATER: '1'
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: /dev/null
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          prefix="${RUNNER_TEMP}/claude-code-2.1.222"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund @anthropic-ai/claude-code@2.1.222
          executable="$prefix/node_modules/.bin/claude"
          test -x "$executable"
          version="$($executable --version)"
          echo "$version"
          [[ "$version" == 2.1.222* ]]
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
      - name: Run pinned isolated base action
        uses: anthropics/claude-code-action/base-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        env:
          CLAUDE_WORKING_DIR: ${{ steps.packet.outputs.runtime_dir }}
          DISABLE_UPDATES: '1'
          DISABLE_AUTOUPDATER: '1'
        with:
          path_to_claude_code_executable: ${{ steps.cli.outputs.executable }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: ${{ steps.packet.outputs.prompt_file }}
          claude_args: |
            --model claude-opus-5[1m]
            --max-turns 1
            --tools ""
            --strict-mcp-config
            --disable-slash-commands
            --disallowedTools "Agent,AskUserQuestion,Bash,BashOutput,CronCreate,CronDelete,CronList,Edit,EnterPlanMode,EnterWorktree,ExitPlanMode,ExitWorktree,Glob,Grep,KillShell,LSP,Monitor,NotebookEdit,PowerShell,Read,ScheduleWakeup,ShareOnboardingGuide,Skill,Task,TaskCreate,TaskGet,TaskList,TaskOutput,TaskUpdate,TodoWrite,ToolSearch,WebFetch,WebSearch,Write"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"verdict":{"type":"string","enum":["NO_BLOCKER_OR_SHOULD_FIX","HAS_BLOCKER_OR_SHOULD_FIX"]},"review_markdown":{"type":"string","minLength":1,"maxLength":20000}},"required":["verdict","review_markdown"]}'
          show_full_output: false

name: Claude Opus 5 v1 auth canary once

on:
  push:
    branches:
      - ops/mark-163-164-ready

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Prove v1 + explicit Opus configuration reaches Anthropic auth
        uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: 'Authentication/model canary only. Do not modify anything. Reply AUTH_OK and stop.'
          claude_args: |
            --model claude-opus-5
            --max-turns 1
            --disallowedTools "Edit,Write"
          display_report: true
          use_sticky_comment: false

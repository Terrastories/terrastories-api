name: Finish Rails validation summary once

on:
  push:
    branches:
      - feat/rails-to-v2-migration

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message != 'fix: wire Rails capture validation summary'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrastories_rails_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d terrastories_rails_fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/terrastories_rails_fixture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rails-to-v2-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Apply minimal green implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          capture = Path('src/migration/rails/capture.ts')
          text = capture.read_text()
          import_anchor = "import {\n  type CapturedBlob,\n  verifyAndCopyActiveStorageBlob,\n} from './active-storage.js';\n"
          import_replacement = import_anchor + "import { buildCaptureValidationSummary } from './validation-summary.js';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('capture import anchor changed')
          text = text.replace(import_anchor, import_replacement, 1)

          manifest_anchor = """    await writeFile(\n      join(temporaryDir, 'manifest.json'),\n      `${JSON.stringify(manifest, null, 2)}\\n`,\n      { encoding: 'utf8', mode: 0o600 }\n    );\n\n    await client.query('COMMIT');\n"""
          manifest_replacement = """    await writeFile(\n      join(temporaryDir, 'manifest.json'),\n      `${JSON.stringify(manifest, null, 2)}\\n`,\n      { encoding: 'utf8', mode: 0o600 }\n    );\n    await writeFile(\n      join(temporaryDir, 'validation-summary.txt'),\n      buildCaptureValidationSummary(manifest),\n      { encoding: 'utf8', mode: 0o600 }\n    );\n\n    await client.query('COMMIT');\n"""
          if text.count(manifest_anchor) != 1:
              raise SystemExit('manifest write anchor changed')
          capture.write_text(text.replace(manifest_anchor, manifest_replacement, 1))

          active = Path('src/migration/rails/active-storage.ts')
          active_text = active.read_text()
          old = 'ActiveStorage blob path escapes trusted export root for key ${key}'
          new = 'ActiveStorage blob path is outside trusted export root for key ${key}'
          if active_text.count(old) != 1:
              raise SystemExit('path escape diagnostic anchor changed')
          active.write_text(active_text.replace(old, new, 1))
          PY
      - run: npx prettier --write src/migration/rails/capture.ts src/migration/rails/active-storage.ts src/migration/rails/validation-summary.ts tests/migration/rails-capture.integration.test.ts tests/migration/rails-contract.test.ts
      - name: Verify focused migration suite green before commit
        run: npx vitest run tests/migration --reporter=dot --maxWorkers=1 --minWorkers=1
      - run: npm run type-check
      - name: Commit green implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/migration/rails/capture.ts src/migration/rails/active-storage.ts src/migration/rails/validation-summary.ts tests/migration/rails-capture.integration.test.ts tests/migration/rails-contract.test.ts
          git diff --cached --quiet && { echo 'No implementation changes produced'; exit 1; }
          git commit -m 'fix: wire Rails capture validation summary'
          git push origin HEAD:feat/rails-to-v2-migration

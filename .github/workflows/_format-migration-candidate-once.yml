name: Format migration candidate once

on:
  push:
    branches:
      - feat/rails-to-v2-migration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rails-to-v2-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prettier --write src/migration/rails/capture.ts tests/migration/rails-contract.test.ts tests/migration/rails-archive-verification.integration.test.ts docs/RAILS-MIGRATION.md
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/migration/rails/capture.ts tests/migration/rails-contract.test.ts tests/migration/rails-archive-verification.integration.test.ts docs/RAILS-MIGRATION.md
          git commit -m 'style: format migration hardening'
          git push origin HEAD:feat/rails-to-v2-migration

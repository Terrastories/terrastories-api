name: Format spec once

on:
  push:
    branches:
      - spec/v2-intentional-evolution

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/v2-intentional-evolution
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prettier --write docs/SPEC-V2.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SPEC-V2.md
          git commit -m 'style: format V2 specification'
          git push origin HEAD:spec/v2-intentional-evolution

name: Align Production Test Once

on:
  push:
    branches: [feat/issue-141-ci-supply-chain]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/issue-141-ci-supply-chain
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Align stale production assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/production/infrastructure.test.ts')
          text = path.read_text()
          old = """      // PostgreSQL migration parity is tracked by #135, so startup must not invoke the fail-closed migrator.\n      expect(prodCompose).not.toContain('node dist/db/migrate.js');\n      expect(prodCompose).toContain(\"command: ['node', 'dist/server.js']\");\n      expect(prodCompose).not.toMatch(/\\bnpm\\b/);"""
          new = """      // PostgreSQL migration parity is tracked by #135, so startup must fail closed through the compiled migrator until parity lands.\n      expect(prodCompose).toContain('node dist/db/migrate.js');\n      expect(prodCompose).toContain('exec node dist/server.js');\n      expect(prodCompose).not.toMatch(/\\bnpm\\b/);"""
          if old not in text:
              raise SystemExit('stale production assertion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write tests/production/infrastructure.test.ts
          git diff --check
      - name: Commit aligned assertion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/production/infrastructure.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: align production fail-closed assertion"
          git push origin HEAD:feat/issue-141-ci-supply-chain

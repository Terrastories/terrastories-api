name: API Comparison Test Suite

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'scripts/api-comparison.js'
      - '.github/workflows/api-comparison.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rails_api_url:
        description: 'Rails API URL for comparison'
        required: false
        default: ''

jobs:
  api-comparison:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Comparison tests own isolated SQLite databases through TestDatabaseManager.
      # PostgreSQL/PostGIS fresh/upgrade migration coverage is intentionally owned
      # by #135; this workflow must not pretend to validate PostgreSQL by feeding
      # the SQLite migration directory to a PostgreSQL connection.
      - name: Run API comparison tests
        env:
          NODE_ENV: test
          RAILS_API_BASE_URL: ${{ github.event.inputs.rails_api_url || 'http://localhost:3001' }}
        run: npm run test:ci:comparison

      - name: Generate comparison report
        run: npm run compatibility:report

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: api-comparison-report
          path: api-comparison-report.html

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const reportContent = [
              '## 🔄 API Comparison Test Results',
              '',
              '✅ API comparison suite and report generation passed.',
              '',
              'PostgreSQL/PostGIS migration validation is tracked separately in #135.',
              '',
              `📊 [Download detailed report](../../actions/runs/${context.runId})`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reportContent,
            });

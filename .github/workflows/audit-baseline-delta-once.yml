name: Audit Baseline Delta Once

on:
  push:
    branches:
      - feat/issue-141-ci-supply-chain

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps

      - name: Compare accepted advisory set with base and inspect fixability
        env:
          BASE_SHA: 2721e083c53fcd96fa3749c25bab716eb10d74e9
        run: |
          git show "$BASE_SHA:config/security-audit-baseline.json" > /tmp/base-baseline.json
          npm audit --json > /tmp/audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const base = JSON.parse(readFileSync('/tmp/base-baseline.json', 'utf8'));
          const head = JSON.parse(readFileSync('config/security-audit-baseline.json', 'utf8'));
          const audit = JSON.parse(readFileSync('/tmp/audit.json', 'utf8'));
          const key = (a) => `${String(a.source)}:${a.package}`;
          const baseKeys = new Set(base.advisories.map(key));
          const headKeys = new Set(head.advisories.map(key));
          const added = head.advisories.filter((a) => !baseKeys.has(key(a)));
          const removed = base.advisories.filter((a) => !headKeys.has(key(a)));

          console.log(`BASE_COUNT=${base.advisories.length}`);
          console.log(`HEAD_COUNT=${head.advisories.length}`);
          console.log(`ADDED_COUNT=${added.length}`);
          for (const a of added) console.log(`ADDED ${key(a)} ${a.severity} ${a.url ?? ''}`);
          console.log(`REMOVED_COUNT=${removed.length}`);
          for (const a of removed) console.log(`REMOVED ${key(a)} ${a.severity} ${a.url ?? ''}`);

          const addedSources = new Set(added.map((a) => String(a.source)));
          const affectedPackages = new Set();
          for (const [packageName, vulnerability] of Object.entries(audit.vulnerabilities ?? {})) {
            const matchingVia = (vulnerability.via ?? []).filter(
              (via) => via && typeof via === 'object' && addedSources.has(String(via.source))
            );
            if (matchingVia.length === 0) continue;
            affectedPackages.add(packageName);
            console.log(
              `AUDIT_PACKAGE ${packageName} severity=${vulnerability.severity} isDirect=${vulnerability.isDirect} range=${vulnerability.range} fixAvailable=${JSON.stringify(vulnerability.fixAvailable)}`
            );
            for (const via of matchingVia) {
              console.log(`AUDIT_VIA ${packageName} source=${via.source} severity=${via.severity} range=${via.range ?? ''} url=${via.url ?? ''}`);
            }
          }

          for (const packageName of [...affectedPackages].sort()) {
            console.log(`EXPLAIN_BEGIN ${packageName}`);
            try {
              const explanation = execFileSync('npm', ['explain', packageName], { encoding: 'utf8' });
              process.stdout.write(explanation);
            } catch (error) {
              console.log(`EXPLAIN_ERROR ${packageName} ${error.message}`);
            }
            console.log(`EXPLAIN_END ${packageName}`);
          }
          NODE

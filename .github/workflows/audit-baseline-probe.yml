name: Final Hardening Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check hardening test formatting
        run: npx prettier --check tests/scripts/ci-supply-chain.test.js tests/scripts/security-scripts.test.js

      - name: Run hardening contracts
        run: npx vitest run tests/scripts/ci-supply-chain.test.js tests/scripts/security-scripts.test.js

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Install system dependencies (self-hosted only)
        run: |
          # Only install dependencies on self-hosted runners
          # GitHub-hosted runners already have these dependencies
          if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ] && ! command -v unzip &> /dev/null; then
            if command -v apt-get &> /dev/null; then
              sudo apt update && sudo apt install -y unzip curl wget build-essential python3
            elif command -v yum &> /dev/null; then
              sudo yum install -y unzip curl wget gcc gcc-c++ make python3
            elif command -v apk &> /dev/null; then
              sudo apk add --no-cache unzip curl wget build-base python3
            else
              echo "Unknown package manager, skipping dependency installation"
            fi
          else
            echo "Dependencies already available or GitHub-hosted runner detected"
          fi

      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Calibrate retained heap on this Node version
        run: npx vitest run tests/production/performance.test.ts -t 'Memory usage remains stable under load' --maxWorkers=1 --silent=false

      - name: Run canonical CI validation
        run: npm run validate:ci

      - name: Run full coverage gate
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce dependency audit baseline
        run: npm run audit:baseline

  sovereignty:
    name: V2 data sovereignty gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run V2 sovereignty release gate
        run: npm run test:sovereignty

  database-sqlite:
    name: Database gate (SQLite/D1-compatible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run SQLite/D1-compatible migration and integration gate
        run: npm run test:db:sqlite

  database-postgres:
    name: Database gate (PostgreSQL 13)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Debian (glibc) image on purpose: musl-based Alpine sorts text by
        # bytes even under en_US.utf8, which hides collation drift from SQLite.
        image: postgres:13
        env:
          POSTGRES_DB: terrastories_test
          POSTGRES_USER: terrastories
          POSTGRES_PASSWORD: terrastories-test
          # Non-UTC server time zone: application sessions must pin UTC
          # themselves (job-level TZ below reaches only the Node process).
          TZ: America/Sao_Paulo
          PGTZ: America/Sao_Paulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrastories -d terrastories_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://terrastories:terrastories-test@localhost:5432/terrastories_test
      ALLOW_POSTGRES_TEST_RESET: 'true'
      # Non-UTC host time zone: timestamp decoding must not depend on the
      # runner being UTC (the gate once passed only on UTC hosts).
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run PostgreSQL migration and integration gate
        run: npm run test:db:postgres

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Install system dependencies (self-hosted only)
        run: |
          if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ] && ! command -v unzip &> /dev/null; then
            if command -v apt-get &> /dev/null; then
              sudo apt update && sudo apt install -y unzip curl wget build-essential python3
            elif command -v yum &> /dev/null; then
              sudo yum install -y unzip curl wget gcc gcc-c++ make python3
            elif command -v apk &> /dev/null; then
              sudo apk add --no-cache unzip curl wget build-base python3
            else
              echo "Unknown package manager, skipping dependency installation"
            fi
          else
            echo "Dependencies already available or GitHub-hosted runner detected"
          fi

      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run canonical CI validation
        run: npm run validate:ci

      - name: Run full coverage gate
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce dependency audit baseline
        run: npm run audit:baseline

  database-sqlite:
    name: Database gate (SQLite/D1-compatible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run SQLite/D1-compatible migration and integration gate
        run: npm run test:db:sqlite

  database-postgres:
    name: Database gate (PostgreSQL 13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: terrastories_test
          POSTGRES_USER: terrastories
          POSTGRES_PASSWORD: terrastories-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrastories -d terrastories_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://terrastories:terrastories-test@localhost:5432/terrastories_test
      ALLOW_POSTGRES_TEST_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run PostgreSQL migration and integration gate
        run: npm run test:db:postgres

  issue135-migration-drift:
    name: Issue 135 migration history diagnostic
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/issue-135-dual-backend-ci'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 2721e083c53fcd96fa3749c25bab716eb10d74e9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-135-dual-backend-ci
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci --legacy-peer-deps

      - name: Reconstruct migration snapshots with pinned Drizzle
        run: |
          python3 <<'PY'
          from pathlib import Path

          baseline = Path('src/db/migrations/postgres/0000_current_compat_baseline.sql')
          text = baseline.read_text()
          needle = "ALTER TABLE users ADD COLUMN IF NOT EXISTS current_sign_in_ip text;\n"
          addition = needle + "--> statement-breakpoint\nALTER TABLE users ALTER COLUMN last_login_at DROP DEFAULT;\n"
          if 'ALTER TABLE users ALTER COLUMN last_login_at DROP DEFAULT;' not in text:
              if needle not in text:
                  raise SystemExit('could not locate last-login correction point')
              baseline.write_text(text.replace(needle, addition, 1))

          harness = Path('scripts/test-db-backend.ts')
          text = harness.read_text()
          old_query = "`SELECT table_name, column_name\n     FROM information_schema.columns\n     WHERE table_schema = 'public'`"
          new_query = "`SELECT table_name, column_name, column_default\n     FROM information_schema.columns\n     WHERE table_schema = 'public'`"
          if old_query in text:
              text = text.replace(old_query, new_query, 1)
          marker = "  assert.equal(names.has('places.location'), false);\n"
          assertion = marker + "\n  const lastLoginColumn = columns.find(\n    (row: any) =>\n      row.table_name === 'users' && row.column_name === 'last_login_at'\n  );\n  assert.ok(lastLoginColumn, 'missing users.last_login_at');\n  assert.equal(\n    lastLoginColumn.column_default,\n    null,\n    'users.last_login_at must not retain a legacy default'\n  );\n"
          if 'users.last_login_at must not retain a legacy default' not in text:
              if marker not in text:
                  raise SystemExit('could not locate PostgreSQL schema assertion point')
              text = text.replace(marker, assertion, 1)
          harness.write_text(text)
          PY

          rewrite_scratch_imports() {
            sed -i -E "s/(from[[:space:]]+['\"][^'\"]+)\.js(['\"])/\1.ts\2/g" src/db/schema-snapshot/*.ts
          }

          rm -rf .issue135-snapshots src/db/schema-snapshot
          mkdir -p .issue135-snapshots/sqlite/meta src/db/schema-snapshot
          while IFS= read -r file; do
            out="src/db/schema-snapshot/${file#src/db/schema/}"
            mkdir -p "$(dirname "$out")"
            git show "$BASE_SHA:$file" > "$out"
          done < <(git ls-tree -r --name-only "$BASE_SHA" src/db/schema | grep '\.ts$')
          rewrite_scratch_imports
          cp src/db/migrations/0000_glamorous_guardsmen.sql .issue135-snapshots/sqlite/
          cp src/db/migrations/meta/0000_snapshot.json .issue135-snapshots/sqlite/meta/
          python3 <<'PY'
          import json
          from pathlib import Path
          journal = json.loads(Path('src/db/migrations/meta/_journal.json').read_text())
          journal['entries'] = journal['entries'][:1]
          Path('.issue135-snapshots/sqlite/meta/_journal.json').write_text(json.dumps(journal, indent=2) + '\n')
          PY
          cat > .issue135-snapshots/sqlite.config.ts <<'EOF'
          import { defineConfig } from 'drizzle-kit';
          export default defineConfig({
            dialect: 'sqlite',
            schema: './src/db/schema-snapshot/*.ts',
            out: './.issue135-snapshots/sqlite',
            dbCredentials: { url: './.issue135-snapshots/state.db' },
            strict: true,
          });
          EOF
          cp src/db/schema/users.ts src/db/schema-snapshot/users.ts
          rewrite_scratch_imports
          npx drizzle-kit generate --config=.issue135-snapshots/sqlite.config.ts --name=authentication_fields
          test -f .issue135-snapshots/sqlite/meta/0001_snapshot.json
          cp src/db/schema/communities.ts src/db/schema-snapshot/communities.ts
          rewrite_scratch_imports
          npx drizzle-kit generate --config=.issue135-snapshots/sqlite.config.ts --name=community_rails_fields
          test -f .issue135-snapshots/sqlite/meta/0002_snapshot.json
          cp src/db/schema/files.ts src/db/schema-snapshot/files.ts
          rewrite_scratch_imports
          npx drizzle-kit generate --config=.issue135-snapshots/sqlite.config.ts --name=file_indexes
          test -f .issue135-snapshots/sqlite/meta/0003_snapshot.json
          cp .issue135-snapshots/sqlite/meta/0001_snapshot.json src/db/migrations/meta/0001_snapshot.json
          cp .issue135-snapshots/sqlite/meta/0002_snapshot.json src/db/migrations/meta/0002_snapshot.json
          cp .issue135-snapshots/sqlite/meta/0003_snapshot.json src/db/migrations/meta/0003_snapshot.json

          rm -rf src/db/schema-snapshot .issue135-snapshots/postgres
          mkdir -p src/db/schema-snapshot .issue135-snapshots/postgres
          cp src/db/schema/*.ts src/db/schema-snapshot/
          git show "$BASE_SHA:src/db/schema/themes.ts" > src/db/schema-snapshot/themes.ts
          rewrite_scratch_imports
          cat > .issue135-snapshots/postgres.config.ts <<'EOF'
          import { defineConfig } from 'drizzle-kit';
          export default defineConfig({
            dialect: 'postgresql',
            schema: './src/db/schema-snapshot/*.ts',
            out: './.issue135-snapshots/postgres',
            dbCredentials: { url: 'postgresql://snapshot:snapshot@127.0.0.1:5432/snapshot' },
            strict: true,
          });
          EOF
          npx drizzle-kit generate --config=.issue135-snapshots/postgres.config.ts --name=current_compat_baseline
          test -f .issue135-snapshots/postgres/meta/0000_snapshot.json
          python3 <<'PY'
          from pathlib import Path
          import os, subprocess
          text = subprocess.check_output(['git', 'show', f"{os.environ['BASE_SHA']}:src/db/schema/themes.ts"], text=True)
          old = "communityId: bigint('community_id', { mode: 'number' }).notNull(),"
          new = "communityId: bigint('community_id', { mode: 'number' })\n      .notNull()\n      .references(() => communitiesPg.id),"
          if old not in text:
              raise SystemExit('could not construct theme ownership state')
          Path('src/db/schema-snapshot/themes.ts').write_text(text.replace(old, new, 1))
          PY
          rewrite_scratch_imports
          npx drizzle-kit generate --config=.issue135-snapshots/postgres.config.ts --name=theme_ownership_fk
          test -f .issue135-snapshots/postgres/meta/0001_snapshot.json
          mkdir -p src/db/migrations/postgres/meta
          cp .issue135-snapshots/postgres/meta/0000_snapshot.json src/db/migrations/postgres/meta/0000_snapshot.json
          cp .issue135-snapshots/postgres/meta/0001_snapshot.json src/db/migrations/postgres/meta/0001_snapshot.json

      - name: Verify no pending migration drift
        run: |
          rm -rf src/db/schema-snapshot
          before_sqlite=$(find src/db/migrations -maxdepth 1 -name '*.sql' | wc -l)
          DATABASE_URL=./data.db npx drizzle-kit generate --name=issue135_generation_probe
          after_sqlite=$(find src/db/migrations -maxdepth 1 -name '*.sql' | wc -l)
          if [ "$after_sqlite" -ne "$before_sqlite" ]; then
            echo '::error::SQLite schema still has pending migration drift'
            cat src/db/migrations/*issue135_generation_probe.sql || true
            exit 21
          fi

          before_pg=$(find src/db/migrations/postgres -maxdepth 1 -name '*.sql' | wc -l)
          DATABASE_URL=postgresql://snapshot:snapshot@127.0.0.1:5432/snapshot npx drizzle-kit generate --name=issue135_generation_probe
          after_pg=$(find src/db/migrations/postgres -maxdepth 1 -name '*.sql' | wc -l)
          if [ "$after_pg" -ne "$before_pg" ]; then
            echo '::error::PostgreSQL schema still has pending migration drift'
            cat src/db/migrations/postgres/*issue135_generation_probe.sql || true
            exit 22
          fi
          echo 'No pending SQLite or PostgreSQL migration drift.'

      - name: Run focused GREEN gates
        run: |
          npx prettier --write scripts/test-db-backend.ts tests/db/connection.test.ts tests/db/migrate.test.ts
          npx vitest run tests/db/connection.test.ts tests/db/migrate.test.ts --reporter=dot --maxWorkers=1 --minWorkers=1
          npm run test:db:sqlite

          docker run -d --name issue135-postgres \
            -e POSTGRES_DB=terrastories_test \
            -e POSTGRES_USER=terrastories \
            -e POSTGRES_PASSWORD=terrastories-test \
            -p 55432:5432 postgres:13-alpine
          trap 'docker rm -f issue135-postgres >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec issue135-postgres pg_isready -U terrastories -d terrastories_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec issue135-postgres pg_isready -U terrastories -d terrastories_test
          DATABASE_URL=postgresql://terrastories:terrastories-test@127.0.0.1:55432/terrastories_test \
            ALLOW_POSTGRES_TEST_RESET=true \
            npm run test:db:postgres

      - name: Commit proven migration history fixes
        run: |
          rm -rf .issue135-snapshots src/db/schema-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db/migrations/postgres/0000_current_compat_baseline.sql \
                  scripts/test-db-backend.ts \
                  src/db/migrations/meta/0001_snapshot.json \
                  src/db/migrations/meta/0002_snapshot.json \
                  src/db/migrations/meta/0003_snapshot.json \
                  src/db/migrations/postgres/meta/0000_snapshot.json \
                  src/db/migrations/postgres/meta/0001_snapshot.json \
                  tests/db/connection.test.ts \
                  tests/db/migrate.test.ts
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete issue 135 migration history'
          git push origin HEAD:feat/issue-135-dual-backend-ci

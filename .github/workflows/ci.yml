name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Install system dependencies (self-hosted only)
        run: |
          if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ] && ! command -v unzip &> /dev/null; then
            if command -v apt-get &> /dev/null; then
              sudo apt update && sudo apt install -y unzip curl wget build-essential python3
            elif command -v yum &> /dev/null; then
              sudo yum install -y unzip curl wget gcc gcc-c++ make python3
            elif command -v apk &> /dev/null; then
              sudo apk add --no-cache unzip curl wget build-base python3
            else
              echo "Unknown package manager, skipping dependency installation"
            fi
          else
            echo "Dependencies already available or GitHub-hosted runner detected"
          fi

      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run canonical CI validation
        run: npm run validate:ci

      - name: Run full coverage gate
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce dependency audit baseline
        run: npm run audit:baseline

  database-sqlite:
    name: Database gate (SQLite/D1-compatible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run SQLite/D1-compatible migration and integration gate
        run: npm run test:db:sqlite

  database-postgres:
    name: Database gate (PostgreSQL 13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: terrastories_test
          POSTGRES_USER: terrastories
          POSTGRES_PASSWORD: terrastories-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrastories -d terrastories_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://terrastories:terrastories-test@localhost:5432/terrastories_test
      ALLOW_POSTGRES_TEST_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run PostgreSQL migration and integration gate
        run: npm run test:db:postgres

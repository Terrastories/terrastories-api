name: Claude Opus 5 Code Review

# Manual-only until #153 proves a healthy Anthropic credential. Keeping this
# fail-closed prevents an external authentication outage from making every PR red.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number being reviewed'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact PR head SHA; the job fails if checkout differs'
        required: true
        type: string
      base_ref:
        description: 'Exact base ref or SHA to review against'
        required: true
        default: 'main'
        type: string

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact review context
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Expected head $EXPECTED_HEAD_SHA, got $actual_head" >&2
            exit 1
          fi
          git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null
          base_sha="$(git rev-parse "${BASE_REF}^{commit}")"
          echo "Reviewing PR #${PR_NUMBER}: ${actual_head} against ${base_sha}"

      - name: Run Claude Opus 5 review
        uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Perform the required independent engineering review for Terrastories PR #${{ inputs.pr_number }}.

            The checked-out exact head is `${{ inputs.expected_head_sha }}` and the exact review base is `${{ inputs.base_ref }}`.
            Verify those refs yourself before reviewing and inspect the complete diff between them.

            Terrastories is an Indigenous community geostorytelling platform. Review for correctness,
            security, privacy, Indigenous data sovereignty, migration/data-loss risk, test integrity,
            offline field-kit behavior, equal SQLite/D1 and PostgreSQL portability, performance,
            maintainability, and supply-chain risk. V2 must not introduce PostGIS/PostgreSQL-only
            product semantics. Legacy Rails/Fastify behavior is evidence, not a compatibility target;
            deliberate V2 differences are valid when the canonical specification says so.

            Do not modify files, commit, push, or weaken tests. You may inspect files and run only the
            explicitly allowed validation/git commands. Report findings ordered as BLOCKER,
            SHOULD-FIX, then NIT, with concrete file/line references and rationale. Explicitly state
            `NO BLOCKER OR SHOULD-FIX FINDINGS` when that is the result. Do not approve or merge the PR.
          claude_args: |
            --model claude-opus-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(npm run validate:ci),Bash(npm run test:coverage),Bash(npm run audit:baseline)"
          display_report: true
          use_sticky_comment: false

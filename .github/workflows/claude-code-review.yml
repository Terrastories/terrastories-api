name: Claude Opus 5 Code Review

# Manual-only until #153 proves a healthy Anthropic credential. Keeping this
# fail-closed prevents an external authentication outage from making every PR red.
# Dispatch this workflow from main and provide the exact current PR head/base SHAs.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number being reviewed'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact current PR head SHA'
        required: true
        type: string
      expected_base_sha:
        description: 'Exact current PR base-tip SHA'
        required: true
        type: string

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Verify requested PR head/base pair
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo 'PR number must be numeric' >&2; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected head must be a 40-character lowercase SHA' >&2; exit 1; }
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected base must be a 40-character lowercase SHA' >&2; exit 1; }

          actual_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          actual_base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.sha)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA" || {
            echo "PR head moved: expected $EXPECTED_HEAD_SHA, got $actual_head" >&2
            exit 1
          }
          test "$actual_base" = "$EXPECTED_BASE_SHA" || {
            echo "PR base moved: expected $EXPECTED_BASE_SHA, got $actual_base" >&2
            exit 1
          }

      - name: Checkout exact review head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commits
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies before secret-bearing review step
        run: npm ci

      - name: Run deterministic repository validation before review
        run: |
          npm run validate:ci
          npm run test:coverage
          npm run audit:baseline

      - name: Build immutable review context
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          {
            echo '# Terrastories Claude review context'
            echo
            echo "PR: #${PR_NUMBER}"
            echo "Exact head: ${EXPECTED_HEAD_SHA}"
            echo "Exact base: ${EXPECTED_BASE_SHA}"
            echo
            echo 'The workflow verified these values against the live GitHub PR immediately before checkout.'
            echo 'Canonical validation, full coverage, and dependency-audit baseline all passed before this file was generated.'
            echo
            echo '## Diff stat'
            echo '```text'
            git diff --no-ext-diff --stat "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
            echo '```'
          } > CLAUDE_REVIEW_CONTEXT.md
          git diff --no-ext-diff --find-renames --find-copies "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA" > CLAUDE_REVIEW_DIFF.patch

      - name: Run Claude Opus 5 long-context review
        uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Perform the required independent engineering review for Terrastories PR #${{ inputs.pr_number }}.

            First read `CLAUDE_REVIEW_CONTEXT.md` and the complete `CLAUDE_REVIEW_DIFF.patch`.
            The workflow already verified the live PR head/base pair and ran canonical validation,
            full coverage, and dependency-audit checks before your secret-bearing step. You may read
            any repository source needed to understand the diff, but do not execute commands or modify files.

            Terrastories is an Indigenous community geostorytelling platform. Review for correctness,
            security, privacy, Indigenous data sovereignty, migration/data-loss risk, test integrity,
            offline field-kit behavior, equal SQLite/D1 and PostgreSQL portability, performance,
            maintainability, and supply-chain risk. V2 must not introduce PostGIS/PostgreSQL-only
            product semantics. Legacy Rails/Fastify behavior is evidence, not a compatibility target;
            deliberate V2 differences are valid when the canonical specification says so.

            Report findings ordered as BLOCKER, SHOULD-FIX, then NIT, with concrete file/line references
            and rationale. Explicitly state `NO BLOCKER OR SHOULD-FIX FINDINGS` when that is the result.
            Do not approve or merge the PR.
          claude_args: |
            --model claude-opus-5[1m]
            --max-turns 20
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          display_report: true
          use_sticky_comment: false

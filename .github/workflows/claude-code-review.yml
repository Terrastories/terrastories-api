name: Claude Automatic Code Review

# Temporarily manual-only: the repository's CLAUDE_CODE_OAUTH_TOKEN is rejected
# by the Anthropic organization with oauth_not_allowed_for_organization.
# Keep the workflow available for credential verification without making every PR
# fail for an external authentication configuration problem. Credential repair and
# automatic re-enablement are tracked by #153; other reviewer workflows remain active.
on:
  workflow_dispatch:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f # beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_tools: "Bash(npm run test),Bash(npm run lint),Bash(npm run type-check),Bash(git log),Bash(git diff),Read"
          direct_prompt: |
            You are reviewing code for Terrastories, an Indigenous community geostorytelling platform.

            Review the current branch against main. Focus on correctness, security,
            data sovereignty, test integrity, performance, and maintainability.
            Do not modify files. Report findings prioritized by severity
            (CRITICAL > MAJOR > MINOR), and explicitly state when there are no
            blocker or should-fix findings.
          use_sticky_comment: true

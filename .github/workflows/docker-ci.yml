name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # =============================================================================
  # DOCKER BUILD TESTING
  # =============================================================================
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [development, production]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: |
          docker build --target ${{ matrix.target }} \
            -t terrastories-api:${{ matrix.target }}-test \
            .

      - name: Test Docker image
        run: |
          if [ "${{ matrix.target }}" == "development" ]; then
            echo "Testing development image dependencies..."
            docker run --rm terrastories-api:${{ matrix.target }}-test \
              npm list --depth=0 typescript eslint vitest
          else
            # Missing secrets must fail, rather than silently selecting dev config.
            set +e
            timeout 20s docker run --name missing-secret-container terrastories-api:production-test
            refusal_status=$?
            set -e
            test "$refusal_status" -eq 1
            docker logs missing-secret-container > missing-secret.log 2>&1
            grep -F "Configuration validation failed" missing-secret.log
            grep -F "JWT_SECRET is required" missing-secret.log
            grep -F "SESSION_SECRET is required" missing-secret.log

            echo "Testing production image startup and health..."
            jwt_secret="$(openssl rand -hex 32)"
            session_secret="$(openssl rand -hex 32)"

            check_health() {
              local health_json
              if ! health_json="$(curl --fail --silent --show-error http://localhost:3000/health)"; then
                return 1
              fi

              HEALTH_JSON="$health_json" node --input-type=module <<'NODE'
          const health = JSON.parse(process.env.HEALTH_JSON);
          if (
            !health ||
            health.status !== 'ok' ||
            !health.config ||
            health.config.valid !== true ||
            !health.database ||
            health.database.connected !== true
          ) {
            process.stderr.write(`Unhealthy API response: ${JSON.stringify(health)}\n`);
            process.exit(1);
          }
          NODE
            }

            docker run --name test-container -d \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e DATABASE_URL=./data/docker-ci.db \
              -e JWT_SECRET="$jwt_secret" \
              -e SESSION_SECRET="$session_secret" \
              terrastories-api:${{ matrix.target }}-test

            healthy=false
            for attempt in $(seq 1 12); do
              if check_health; then
                healthy=true
                break
              fi

              if [ "$(docker inspect --format='{{.State.Running}}' test-container)" != "true" ]; then
                docker logs test-container
                exit 1
              fi

              sleep 5
            done

            if [ "$healthy" != "true" ]; then
              docker logs test-container
              exit 1
            fi

            check_health
            test "$(docker inspect --format='{{.State.Running}}' test-container)" = "true"
            docker exec test-container node --input-type=module -e '
              for (const method of ["GET", "HEAD"]) {
                const response = await fetch("http://127.0.0.1:3000/dev/seed", {method});
                if (response.status !== 404) process.exit(1);
              }'
            docker stop test-container
          fi

      - name: Cleanup Docker image test
        if: always() && matrix.target == 'production'
        run: docker rm -f test-container missing-secret-container > /dev/null 2>&1 || true

  # =============================================================================
  # DOCKER COMPOSE CONFIGURATION TESTING
  # =============================================================================
  docker-compose-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compose-file:
          - docker-compose.yml
          - docker-compose.dev.yml
          - docker-compose.prod.yml
          - docker-compose.field-kit.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test Docker Compose configuration syntax
        env:
          JWT_SECRET: ci-fixture-jwt-secret-at-least-32-characters
          SESSION_SECRET: ci-fixture-session-secret-at-least-32-characters
        run: |
          echo "Testing ${{ matrix.compose-file }} configuration..."

          # Test base configuration
          if [ "${{ matrix.compose-file }}" == "docker-compose.yml" ]; then
            docker compose -f ${{ matrix.compose-file }} config > /dev/null
          else
            # Test with base configuration for overrides
            docker compose -f docker-compose.yml -f ${{ matrix.compose-file }} config > /dev/null
          fi

          if [ "${{ matrix.compose-file }}" = "docker-compose.prod.yml" ]; then
            for missing in JWT_SECRET SESSION_SECRET; do
              if env -u "$missing" docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.prod.yml config --quiet; then
                echo "Production Compose accepted missing $missing"
                exit 1
              fi
            done
          fi

          if [ "${{ matrix.compose-file }}" = "docker-compose.field-kit.yml" ]; then
            # Include inactive profiles so a broken optional sync service cannot hide.
            # Keep unresolved placeholders out of logs/artifacts; pass JSON via stdin.
            set -o pipefail
            docker compose -f docker-compose.yml -f docker-compose.field-kit.yml \
              --profile '*' config --no-interpolate --format json |
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              const config = JSON.parse(readFileSync(0, "utf8"));
              assert.ok(config.services.api, "field-kit API must remain available");
              // --no-interpolate retains Compose list-form environment entries.
              const rawEnv = config.services.api.environment;
              const env = Array.isArray(rawEnv)
                ? Object.fromEntries(rawEnv.map(entry => {
                    const split = entry.indexOf("=");
                    return [entry.slice(0, split), entry.slice(split + 1)];
                  }))
                : rawEnv;
              assert.equal(env.OFFLINE_MODE, "true");
              assert.equal(env.DATABASE_URL, "./data/field-kit.db");
              assert.equal(config.services["sync-service"], undefined, "sync design is deferred (#182)");
              assert.equal(config.volumes?.sync_queue, undefined, "no unused sync queue");
              for (const service of Object.values(config.services)) {
                assert.ok(!service.profiles?.includes("sync-enabled"), "no unsupported sync profile");
              }
            '
          fi

          echo "✅ ${{ matrix.compose-file }} syntax is valid"

  # =============================================================================
  # INTEGRATION TESTING - Basic deployment test
  # =============================================================================
  integration-test:
    runs-on: ubuntu-latest
    needs: [docker-build, docker-compose-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          PORT=3000
          POSTGRES_PASSWORD=test123
          JWT_SECRET=test-jwt-secret-minimum-32-characters-required-for-security-testing
          SESSION_SECRET=test-session-secret-minimum-32-characters-required-for-cookies-testing
          DATABASE_URL=postgresql://terrastories:test123@db:5432/terrastories
          DATABASE_URL_TEST=:memory:
          LOG_LEVEL=error
          UPLOAD_DIR=/app/uploads
          CORS_ORIGIN=http://localhost:3001
          EOF

      - name: Start basic environment
        run: |
          # Use basic development environment
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.test up -d --build

          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 30

          # Check service status
          docker compose ps

      - name: Test basic functionality
        run: |
          # Wait for API to be ready
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ API health check passed"
              break
            fi
            sleep 5
            timeout=$((timeout - 5))
            echo "Still waiting for API... ($timeout seconds remaining)"
          done

          if [ $timeout -eq 0 ]; then
            echo "❌ API failed to become ready"
            docker compose logs api
            exit 1
          fi

          # Test API documentation endpoint
          if curl -f -s http://localhost:3000/documentation > /dev/null 2>&1; then
            echo "✅ API documentation accessible"
          else
            echo "⚠️ API documentation not accessible"
          fi

      - name: Test database connectivity
        run: |
          # Test database connection
          if docker compose exec -T db pg_isready -U terrastories -d terrastories > /dev/null 2>&1; then
            echo "✅ Database connectivity verified"
          else
            echo "❌ Database connection failed"
            docker compose logs db
            exit 1
          fi

      - name: Cleanup integration environment
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v || true
          docker system prune -f || true

name: Format Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Print exact Prettier diff
        run: |
          npx prettier --write config/security-audit-baseline.json scripts/check-audit-baseline.mjs
          git diff --no-color -- config/security-audit-baseline.json scripts/check-audit-baseline.mjs

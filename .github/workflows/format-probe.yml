name: Format Probe

on:
  push:
    branches: [feat/issue-141-ci-supply-chain]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Print canonical Prettier output
        run: npx prettier tests/scripts/release-evidence-qa.test.js

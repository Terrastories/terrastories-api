name: Issue 135 branch fixup

on:
  push:
    branches:
      - feat/issue-135-dual-backend-ci

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-135-dual-backend-ci
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Normalize PostgreSQL fixture timestamps
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/test-db-backend.ts')
          source = path.read_text()
          source, count = re.subn(r"\$\{new Date\(([^)]*)\)\}", r"${\1}", source)
          if count != 16:
              raise SystemExit(f'expected 16 PostgreSQL fixture Date wrappers, found {count}')
          path.write_text(source)
          PY

      - name: Format changed text files
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD \
            | grep -E '\.(ts|js|mjs|json|md|yml|yaml)$' \
            | xargs -r npx prettier --write

      - name: Commit fixup
        run: |
          if git diff --quiet; then
            echo 'No fixup changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-db-backend.ts tests/db/places-schema.test.ts src tests package.json .github/workflows/ci.yml docs docker-compose.yml scripts/init-db.sql 2>/dev/null || true
          git commit -m 'fix: normalize postgres fixture timestamps and formatting'
          git push origin HEAD:feat/issue-135-dual-backend-ci

name: Issue 135 final CI fix

on:
  push:
    branches:
      - feat/issue-135-dual-backend-ci

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: terrastories_test
          POSTGRES_USER: terrastories
          POSTGRES_PASSWORD: terrastories-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrastories -d terrastories_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://terrastories:terrastories-test@localhost:5432/terrastories_test
      ALLOW_POSTGRES_TEST_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-135-dual-backend-ci
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply deterministic CI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(source.replace(old, new))

          replace_once(
              'scripts/test-db-backend.ts',
              """  await client.unsafe(
            'CREATE TEMP TABLE null_unique_probe (value text UNIQUE)'
          );
          await client.unsafe(
            'INSERT INTO null_unique_probe (value) VALUES (NULL), (NULL)'
          );
          await client.unsafe(
            \"INSERT INTO null_unique_probe (value) VALUES ('duplicate')\"
          );
          await assert.rejects(
            client.unsafe(
              \"INSERT INTO null_unique_probe (value) VALUES ('duplicate')\"
            )
          );
          await client.unsafe('DROP TABLE null_unique_probe');
          """,
              """  await client.unsafe('DROP TABLE IF EXISTS null_unique_probe');
          await client.unsafe(
            'CREATE TABLE null_unique_probe (value text UNIQUE)'
          );
          try {
            await client.unsafe(
              'INSERT INTO null_unique_probe (value) VALUES (NULL), (NULL)'
            );
            await client.unsafe(
              \"INSERT INTO null_unique_probe (value) VALUES ('duplicate')\"
            );
            await assert.rejects(
              client.unsafe(
                \"INSERT INTO null_unique_probe (value) VALUES ('duplicate')\"
              )
            );
          } finally {
            await client.unsafe('DROP TABLE IF EXISTS null_unique_probe');
          }
          """,
              'postgres nullable unique probe',
          )

          replace_once(
              'tests/services/community.service.test.ts',
              """    it('should keep Rails country/beta persistence deferred to #135', async () => {
            const result = await communityService.createCommunity({
              name: 'Deferred Rails Fields Community',
              country: 'CA',
              beta: true,
            });

            expect(result.name).toBe('Deferred Rails Fields Community');
            expect(result).not.toHaveProperty('country');
            expect(result).not.toHaveProperty('beta');
          });
          """,
              """    it('should persist Rails-compatible country/beta fields', async () => {
            const result = await communityService.createCommunity({
              name: 'Rails Fields Community',
              country: 'CA',
              beta: true,
            });

            expect(result.name).toBe('Rails Fields Community');
            expect(result.country).toBe('CA');
            expect(result.beta).toBe(true);
          });
          """,
              'community service create compatibility test',
          )

          replace_once(
              'tests/services/community.service.test.ts',
              """    it('should keep Rails country/beta updates deferred to #135', async () => {
            const community = await communityService.createCommunity({
              name: 'Deferred Update Community',
            });

            const result = await communityService.updateCommunity(community.id, {
              country: 'CA',
              beta: true,
            });

            expect(result.name).toBe('Deferred Update Community');
            expect(result).not.toHaveProperty('country');
            expect(result).not.toHaveProperty('beta');
          });
          """,
              """    it('should update Rails-compatible country/beta fields', async () => {
            const community = await communityService.createCommunity({
              name: 'Rails Update Community',
            });

            const result = await communityService.updateCommunity(community.id, {
              country: 'CA',
              beta: true,
            });

            expect(result.name).toBe('Rails Update Community');
            expect(result.country).toBe('CA');
            expect(result.beta).toBe(true);
          });
          """,
              'community service update compatibility test',
          )

          replace_once(
              'tests/services/user.service.test.ts',
              """    test('should omit deferred authentication fields from current user records', async () => {
            const registeredUser = await userService.registerUser({
              email: 'deferred-auth-fields@example.com',
              password: 'StrongPassword123@',
              firstName: 'Deferred',
              lastName: 'Auth',
              role: 'viewer',
              communityId: testCommunityId,
            });
            const user = await userService.getUserById(
              registeredUser.id,
              testCommunityId
            );

            for (const field of [
              'resetPasswordToken',
              'resetPasswordSentAt',
              'rememberCreatedAt',
              'signInCount',
              'lastSignInAt',
              'currentSignInIp',
            ]) {
              expect(user).not.toHaveProperty(field);
            }
          });
          """,
              """    test('should expose restored authentication fields with safe defaults', async () => {
            const registeredUser = await userService.registerUser({
              email: 'restored-auth-fields@example.com',
              password: 'StrongPassword123@',
              firstName: 'Restored',
              lastName: 'Auth',
              role: 'viewer',
              communityId: testCommunityId,
            });
            const user = await userService.getUserById(
              registeredUser.id,
              testCommunityId
            );

            expect(user).toMatchObject({
              resetPasswordToken: null,
              resetPasswordSentAt: null,
              rememberCreatedAt: null,
              signInCount: 0,
              lastSignInAt: null,
              currentSignInIp: null,
            });
          });
          """,
              'user service auth compatibility test',
          )
          PY

      - name: Format changed files
        run: npx prettier --write scripts/test-db-backend.ts tests/services/community.service.test.ts tests/services/user.service.test.ts

      - name: Run affected service tests
        run: npx vitest run tests/services/community.service.test.ts tests/services/user.service.test.ts --reporter=dot --silent=true

      - name: Run both database gates
        run: npm run test:db:sqlite && npm run test:db:postgres

      - name: Run canonical validation
        run: npm run validate:ci

      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-db-backend.ts tests/services/community.service.test.ts tests/services/user.service.test.ts
          git commit -m 'test: remove stale issue 135 deferral expectations'
          git push origin HEAD:feat/issue-135-dual-backend-ci

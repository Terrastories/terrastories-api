name: Issue 135 final migration state

on:
  workflow_dispatch:
  push:
    branches:
      - feat/issue-135-dual-backend-ci

permissions:
  contents: write

jobs:
  repair-and-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: terrastories_test
          POSTGRES_USER: terrastories
          POSTGRES_PASSWORD: terrastories-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrastories -d terrastories_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASE_SHA: 2721e083c53fcd96fa3749c25bab716eb10d74e9
      PG_TEST_URL: postgresql://terrastories:terrastories-test@localhost:5432/terrastories_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-135-dual-backend-ci
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Add last-login upgrade correction and runtime assertion
        run: |
          python3 <<'PY'
          from pathlib import Path

          baseline = Path('src/db/migrations/postgres/0000_current_compat_baseline.sql')
          text = baseline.read_text()
          needle = "ALTER TABLE users ADD COLUMN IF NOT EXISTS current_sign_in_ip text;\n"
          addition = needle + "--> statement-breakpoint\nALTER TABLE users ALTER COLUMN last_login_at DROP DEFAULT;\n"
          if 'ALTER TABLE users ALTER COLUMN last_login_at DROP DEFAULT;' not in text:
              if needle not in text:
                  raise SystemExit('could not locate users auth migration insertion point')
              text = text.replace(needle, addition, 1)
              baseline.write_text(text)

          harness = Path('scripts/test-db-backend.ts')
          text = harness.read_text()
          old_query = "`SELECT table_name, column_name\n     FROM information_schema.columns\n     WHERE table_schema = 'public'`"
          new_query = "`SELECT table_name, column_name, column_default\n     FROM information_schema.columns\n     WHERE table_schema = 'public'`"
          if old_query in text:
              text = text.replace(old_query, new_query, 1)
          marker = "  assert.equal(names.has('places.location'), false);\n"
          assertion = marker + "\n  const lastLoginColumn = columns.find(\n    (row: any) =>\n      row.table_name === 'users' && row.column_name === 'last_login_at'\n  );\n  assert.ok(lastLoginColumn, 'missing users.last_login_at');\n  assert.equal(\n    lastLoginColumn.column_default,\n    null,\n    'users.last_login_at must not retain a legacy default'\n  );\n"
          if 'users.last_login_at must not retain a legacy default' not in text:
              if marker not in text:
                  raise SystemExit('could not locate PostgreSQL schema assertion insertion point')
              text = text.replace(marker, assertion, 1)
          harness.write_text(text)
          PY

      - name: Generate SQLite migration snapshots with pinned Drizzle
        run: |
          rm -rf .issue135-snapshots src/db/schema-snapshot
          mkdir -p .issue135-snapshots/sqlite/meta src/db/schema-snapshot

          while IFS= read -r file; do
            out="src/db/schema-snapshot/${file#src/db/schema/}"
            mkdir -p "$(dirname "$out")"
            git show "$BASE_SHA:$file" > "$out"
          done < <(git ls-tree -r --name-only "$BASE_SHA" src/db/schema | grep '\.ts$')

          cp src/db/migrations/0000_glamorous_guardsmen.sql .issue135-snapshots/sqlite/
          cp src/db/migrations/meta/0000_snapshot.json .issue135-snapshots/sqlite/meta/
          python3 <<'PY'
          import json
          from pathlib import Path
          journal = json.loads(Path('src/db/migrations/meta/_journal.json').read_text())
          journal['entries'] = journal['entries'][:1]
          Path('.issue135-snapshots/sqlite/meta/_journal.json').write_text(json.dumps(journal, indent=2) + '\n')
          PY
          cat > .issue135-snapshots/sqlite.config.ts <<'EOF'
          import { defineConfig } from 'drizzle-kit';
          export default defineConfig({
            dialect: 'sqlite',
            schema: './src/db/schema-snapshot/*.ts',
            out: './.issue135-snapshots/sqlite',
            dbCredentials: { url: './.issue135-snapshots/state.db' },
            strict: true,
          });
          EOF

          cp src/db/schema/users.ts src/db/schema-snapshot/users.ts
          npx drizzle-kit generate --config=.issue135-snapshots/sqlite.config.ts --name=authentication_fields
          cp src/db/schema/communities.ts src/db/schema-snapshot/communities.ts
          npx drizzle-kit generate --config=.issue135-snapshots/sqlite.config.ts --name=community_rails_fields
          cp src/db/schema/files.ts src/db/schema-snapshot/files.ts
          npx drizzle-kit generate --config=.issue135-snapshots/sqlite.config.ts --name=file_indexes

          cp .issue135-snapshots/sqlite/meta/0001_snapshot.json src/db/migrations/meta/0001_snapshot.json
          cp .issue135-snapshots/sqlite/meta/0002_snapshot.json src/db/migrations/meta/0002_snapshot.json
          cp .issue135-snapshots/sqlite/meta/0003_snapshot.json src/db/migrations/meta/0003_snapshot.json

      - name: Generate PostgreSQL migration snapshots with pinned Drizzle
        run: |
          mkdir -p .issue135-snapshots/postgres src/db/schema-snapshot
          rm -rf .issue135-snapshots/postgres/*
          cp src/db/schema/*.ts src/db/schema-snapshot/
          git show "$BASE_SHA:src/db/schema/themes.ts" > src/db/schema-snapshot/themes.ts

          cat > .issue135-snapshots/postgres.config.ts <<'EOF'
          import { defineConfig } from 'drizzle-kit';
          export default defineConfig({
            dialect: 'postgresql',
            schema: './src/db/schema-snapshot/*.ts',
            out: './.issue135-snapshots/postgres',
            dbCredentials: { url: 'postgresql://snapshot:snapshot@127.0.0.1:5432/snapshot' },
            strict: true,
          });
          EOF

          npx drizzle-kit generate --config=.issue135-snapshots/postgres.config.ts --name=current_compat_baseline

          python3 <<'PY'
          from pathlib import Path
          import os, subprocess
          base = os.environ['BASE_SHA']
          text = subprocess.check_output(
              ['git', 'show', f'{base}:src/db/schema/themes.ts'], text=True
          )
          old = "communityId: bigint('community_id', { mode: 'number' }).notNull(),"
          new = "communityId: bigint('community_id', { mode: 'number' })\n      .notNull()\n      .references(() => communitiesPg.id),"
          if old not in text:
              raise SystemExit('could not construct PostgreSQL theme FK snapshot state')
          Path('src/db/schema-snapshot/themes.ts').write_text(text.replace(old, new, 1))
          PY
          npx drizzle-kit generate --config=.issue135-snapshots/postgres.config.ts --name=theme_ownership_fk

          mkdir -p src/db/migrations/postgres/meta
          cp .issue135-snapshots/postgres/meta/0000_snapshot.json src/db/migrations/postgres/meta/0000_snapshot.json
          cp .issue135-snapshots/postgres/meta/0001_snapshot.json src/db/migrations/postgres/meta/0001_snapshot.json

      - name: Verify current schemas do not produce duplicate migration drift
        run: |
          rm -rf src/db/schema-snapshot .issue135-snapshots/check
          mkdir -p .issue135-snapshots/check

          before_sqlite=$(find src/db/migrations -maxdepth 1 -name '*.sql' | wc -l)
          DATABASE_URL=./data.db npx drizzle-kit generate --name=issue135_generation_probe
          after_sqlite=$(find src/db/migrations -maxdepth 1 -name '*.sql' | wc -l)
          if [ "$after_sqlite" -ne "$before_sqlite" ]; then
            echo 'SQLite schema still produces a pending migration:'
            git status --short src/db/migrations
            tail -n +1 src/db/migrations/*issue135_generation_probe.sql || true
            exit 21
          fi

          before_pg=$(find src/db/migrations/postgres -maxdepth 1 -name '*.sql' | wc -l)
          DATABASE_URL="$PG_TEST_URL" npx drizzle-kit generate --name=issue135_generation_probe
          after_pg=$(find src/db/migrations/postgres -maxdepth 1 -name '*.sql' | wc -l)
          if [ "$after_pg" -ne "$before_pg" ]; then
            echo 'PostgreSQL schema still produces a pending migration:'
            git status --short src/db/migrations/postgres
            tail -n +1 src/db/migrations/postgres/*issue135_generation_probe.sql || true
            exit 22
          fi

      - name: Run focused regression gates
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          ALLOW_POSTGRES_TEST_RESET: 'true'
        run: |
          npx vitest run tests/db/connection.test.ts tests/db/migrate.test.ts --reporter=dot --maxWorkers=1 --minWorkers=1
          npm run test:db:postgres

      - name: Clean scratch files and commit fixes
        run: |
          rm -rf .issue135-snapshots src/db/schema-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db/migrations/postgres/0000_current_compat_baseline.sql \
                  scripts/test-db-backend.ts \
                  src/db/migrations/meta/*_snapshot.json \
                  src/db/migrations/postgres/meta/*_snapshot.json
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete issue 135 migration state'
          git push origin HEAD:feat/issue-135-dual-backend-ci

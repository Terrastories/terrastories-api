name: Issue 135 review-fix RED proof

on:
  push:
    branches:
      - feat/issue-135-dual-backend-ci

jobs:
  red-connection-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx vitest run tests/db/connection.test.ts --reporter=verbose

  red-persisted-volume-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx vitest run tests/docker/docker-config.test.ts --reporter=verbose

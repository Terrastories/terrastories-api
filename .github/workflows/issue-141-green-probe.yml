name: Issue 141 Green Probe

on:
  push:
    branches:
      - feat/issue-141-ci-supply-chain

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/issue-141-ci-supply-chain

      - name: Enable fail-closed secret scanning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/supply-chain.yml')
          text = path.read_text()
          old = '          extra_args: --results=verified,unknown\n'
          new = '          extra_args: --results=verified,unknown --fail\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('expected TruffleHog argument line not found')
              path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- .github/workflows/supply-chain.yml; then
            echo "Fail-closed secret scanning already enabled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/supply-chain.yml
          git commit -m "fix: make secret scan fail on findings"
          git push origin HEAD:feat/issue-141-ci-supply-chain

name: Issues Reviewer

on:
  issues:
    types: [opened]

# Requires repository secret: OPENAI_API_KEY
permissions:
  contents: read
  issues: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Check for OPENAI_API_KEY
        id: api_key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not set. Skipping issue revision."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.api_key.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        if: steps.api_key.outputs.available == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        if: steps.api_key.outputs.available == 'true'
        run: npm install -g @openai/codex

      - name: Revise issue via Codex
        if: steps.api_key.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # Ensure gh is authenticated with the workflow token
          gh auth status || gh auth setup-git

          PROMPT=$(cat <<'EOF'
          You are Codex running in CI to revise a newly opened GitHub issue for this repository.

          Canonical preflight — do this before rewriting the issue:
          - Read AGENTS.md, docs/SOURCE-OF-TRUTH.md, and the governing sections of docs/SPEC-V2.md.
          - Treat the canonical spec as authoritative over historical code/tests/issues.
          - Check whether the request is approved parity/hardening or a new product decision. Do not silently turn an issue into a spec amendment.

          Goal:
          - Preserve the author's intent while making the issue implementation-ready under the repository's Issue Readiness Contract.
          - Clarify ambiguities, define measurable acceptance criteria, explicit non-goals, dependencies/base relationships, portability/offline impact, sovereignty/security evidence, migration implications, and terminating validation gates.
          - If scope increases materially or contains separable dependency lanes, propose splitting rather than creating a mega-issue.

          What to do (execute commands as needed):
          1) Fetch current issue JSON/body and available readiness labels:
             gh issue view "$ISSUE_NUMBER" --json number,title,body,labels,assignees,milestone,comments > current-issue.json
             gh label list --limit 200 > available-labels.txt
          2) Produce revised-issue.md with these sections:
             - Overview / Problem
             - Governing Spec (exact SPEC-V2.md sections/requirement IDs)
             - Goal
             - Non-Goals
             - Acceptance Criteria (SMART checklist)
             - Technical Plan
             - Portability & Deployment Impact (Workers/D1, Node/PostgreSQL, Node/SQLite field kit as applicable)
             - Offline / Field-Kit Impact
             - Security & Data Sovereignty (including negative/adversarial tests where applicable)
             - Migration / Rollback / Restore Impact
             - Dependencies & Required Base / Stacking Relationship
             - Validation Gates (terminating/fail-closed commands and concrete evidence)
             - Estimation / Suggested Slicing
             - Notes / Decisions Needed
          3) Preserve original context. If the request conflicts with SPEC-V2.md or requires a new product/architecture decision, state the exact conflict under Notes / Decisions Needed and do not write acceptance criteria that normalize the conflict.
          4) Validate that acceptance criteria, technical plan, dependencies, portability, security, and validation evidence are mutually consistent. Call out any material scope increase and propose child issues where appropriate.
          5) Update the issue body:
             gh issue edit "$ISSUE_NUMBER" --body-file revised-issue.md
          6) Apply exactly one readiness label only if that label exists in available-labels.txt:
             - status:needs-decision when a spec/product decision is unresolved;
             - status:blocked when intent is clear but a prerequisite/base dependency is not satisfied;
             - status:ready only when the issue is spec-aligned, dependencies/base are satisfied, and acceptance/validation evidence is implementable.
             Preserve unrelated labels.
          7) Add a concise comment summarizing what changed, the governing spec, and the resulting readiness status/reason.
          8) Exit successfully.

          Constraints:
          - Use concise, actionable wording and preserve author intent.
          - Never introduce PostGIS/database-specific spatial behavior as a V2 requirement unless the canonical spec is explicitly amended.
          - Never reintroduce removed V1 elder/cultural-metadata scope merely because historical implementation contains it.
          - Preserve community isolation/data sovereignty and fully offline field-kit operation.
          - Shared database behavior must consider both D1/SQLite-compatible and PostgreSQL evidence.
          - Do not invent readiness. Fail closed into status:needs-decision or status:blocked when the evidence is incomplete.
          EOF
          )

          codex exec --full-auto "$PROMPT"

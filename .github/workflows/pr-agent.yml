name: PR Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # Skip if the event was triggered by a bot to avoid infinite loops
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: AI-powered PR review
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          # OpenAI configuration for Terrastories API
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Model configuration - using GPT-4o with GPT-4 fallback for stability
          config.model: 'gpt-5'
          config.fallback_models: '["gpt-5-mini", "gpt-5-nano"]'
          config.ai_timeout: '300'

          # GitHub Action automation settings
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'true'
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'

          # Terrastories-specific review instructions. The canonical product/architecture
          # contract lives in docs/SPEC-V2.md; AGENTS.md and docs/SOURCE-OF-TRUTH.md
          # define how reviewers must apply it.
          pr_reviewer.extra_instructions: |
            Review against the repository's canonical context, in this authority order:
            1. docs/SPEC-V2.md and explicitly approved product decisions/amendments
            2. docs/SOURCE-OF-TRUTH.md and AGENTS.md execution rules
            3. Active subordinate plans, then issues, then current code/tests as implementation evidence

            CRITICAL TERRASTORIES INVARIANTS:
            - Preserve Indigenous data sovereignty and strict community-scoped isolation, including super-admin boundaries.
            - V2 must remain portable across Workers + D1 + R2, Node.js + PostgreSQL + local storage, and fully offline Node.js + SQLite + local filesystem field kits.
            - Shared database/spatial behavior must remain SQLite-compatible. PostGIS and other database-specific spatial extensions are V2 non-goals unless the canonical spec is explicitly amended.
            - Hono is the V2 target framework, but do not describe Hono paths as current on main until the relevant migration PR has landed.
            - Do not reintroduce V1 scope explicitly removed by V2, including elder roles/restrictions, elder speaker status, cultural-significance metadata, community cultural settings, story-place cultural context, or the removed cultural-restriction schema.
            - Field kits must work with no runtime cloud dependency.

            REVIEW QUALITY:
            - Check Route → Service → Repository → Database separation, strict TypeScript, Zod boundary validation, auth/security, file/media safety, and N+1/query regressions.
            - Require terminating, fail-closed validation evidence appropriate to the changed surface. Shared DB changes require both SQLite/D1-compatible and PostgreSQL evidence.
            - Treat `/api/v1` behavior as legacy/coexistence evidence, not as the canonical V2 URL contract; intentional V1/V2 differences must map to SPEC-V2.md.
            - Never recommend preserving stale behavior merely because historical code/tests/docs contain it.

          # Code suggestions configuration
          pr_code_suggestions.num_code_suggestions: '6'
          pr_code_suggestions.suggestions_score_threshold: '7'
          pr_code_suggestions.extra_instructions: |
            Prioritize suggestions that strengthen the canonical V2 contract:
            - Community isolation, data sovereignty, auth/session, and file-security correctness
            - D1/SQLite + PostgreSQL portability and offline field-kit compatibility
            - Portable application-level spatial behavior; never introduce PostGIS as a V2 requirement
            - Route → Service → Repository → Database separation and strict type safety
            - Fail-closed tests/CI and meaningful edge/adversarial coverage
            - Explicit mapping of intentional V1/V2 differences without restoring removed elder/cultural-metadata scope

          # Review configuration for TypeScript/Node.js project
          pr_reviewer.require_tests_review: 'true'
          pr_reviewer.require_security_review: 'true'
          pr_reviewer.enable_review_labels_effort: 'true'
          pr_reviewer.enable_review_labels_security: 'true'

          # Performance optimization for large patches
          # config.large_patch_policy: "clip"
          # config.max_model_tokens: "32000"
          # config.patch_extra_lines_before: "3"
          # config.patch_extra_lines_after: "1"

          # Verbosity for debugging (set to "1" for production)
          config.verbosity_level: '1'

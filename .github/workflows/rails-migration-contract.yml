name: Rails migration contract

on:
  pull_request:
    paths:
      - 'src/migration/rails/**'
      - 'src/scripts/migrate-rails.ts'
      - 'tests/migration/**'
      - 'tests/fixtures/rails/**'
      - 'docs/RAILS-MIGRATION.md'
      - '.github/workflows/rails-migration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrastories_rails_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d terrastories_rails_fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/terrastories_rails_fixture

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run Rails migration source contract
        run: npx vitest run tests/migration --reporter=dot --maxWorkers=1 --minWorkers=1

      # This PR is intentionally stacked on the spec branch. The repository's
      # normal CI workflow only triggers for PRs targeting main, so reproduce
      # the canonical gates here rather than accepting a validation blind spot.
      - name: Run canonical CI validation
        run: npm run validate:ci

      - name: Run full coverage gate
        run: npm run test:coverage

      - name: Enforce dependency audit baseline
        run: npm run audit:baseline

name: Rails migration contract

on:
  push:
    branches: [main]
    paths:
      - 'src/migration/rails/**'
      - 'src/migration/v2/**'
      - 'scripts/migrate-rails.ts'
      - 'scripts/migrate-rails-transform.ts'
      - 'scripts/migrate-rails-load.ts'
      - 'src/shared/schemas/media-v2.ts'
      - 'scripts/fixtures/gen-rails-fixture.ts'
      - 'tests/migration/**'
      - 'tests/fixtures/rails/**'
      - 'docs/RAILS-MIGRATION.md'
      - '.github/workflows/rails-migration-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/migration/rails/**'
      - 'src/migration/v2/**'
      - 'scripts/migrate-rails.ts'
      - 'scripts/migrate-rails-transform.ts'
      - 'scripts/migrate-rails-load.ts'
      - 'src/shared/schemas/media-v2.ts'
      - 'scripts/fixtures/gen-rails-fixture.ts'
      - 'tests/migration/**'
      - 'tests/fixtures/rails/**'
      - 'docs/RAILS-MIGRATION.md'
      - '.github/workflows/rails-migration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrastories_rails_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d terrastories_rails_fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/terrastories_rails_fixture

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Run Rails migration source contract
        run: npm run test:migration

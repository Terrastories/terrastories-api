name: Rails migration contract

on:
  pull_request:
    paths:
      - 'src/migration/rails/**'
      - 'src/scripts/migrate-rails.ts'
      - 'tests/migration/**'
      - 'tests/fixtures/rails/**'
      - '.github/workflows/rails-migration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrastories_rails_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d terrastories_rails_fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/terrastories_rails_fixture

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Rails migration source contract
        run: npx vitest run tests/migration --reporter=dot --maxWorkers=1 --minWorkers=1

      - name: Type-check migration implementation
        run: npm run type-check

      - name: Lint migration implementation
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

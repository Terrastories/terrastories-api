name: Temporary issue 141 verification

on:
  push:
    branches:
      - feat/issue-141-ci-supply-chain

permissions:
  contents: read

jobs:
  targeted-verification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Fastify compatibility type-check
        run: npm run type-check

      - name: Verify production runtime security contract
        run: npx vitest run tests/docker/runtime-security.test.ts --reporter=verbose

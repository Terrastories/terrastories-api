name: Temporary issue 141 lockfile refresh

on:
  push:
    branches:
      - feat/issue-141-ci-supply-chain

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[deps-lock]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/issue-141-ci-supply-chain

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Refresh vulnerable production dependencies
        run: |
          npm pkg set \
            'dependencies.fastify=^5.12.1' \
            'dependencies.@fastify/static=^10.1.3' \
            'dependencies.drizzle-orm=^0.45.2' \
            'dependencies.sharp=^0.35.3'
          npm install --package-lock-only --ignore-scripts

      - name: Commit generated manifest and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes generated.'
            exit 0
          fi
          git commit -m 'chore: refresh vulnerable production dependencies [deps-lock]'
          git push origin HEAD:feat/issue-141-ci-supply-chain

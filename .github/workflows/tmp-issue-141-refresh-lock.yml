name: Temporary issue 141 dependency refresh

on:
  push:
    branches:
      - feat/issue-141-ci-supply-chain

permissions:
  contents: write

jobs:
  refresh-dependencies:
    if: ${{ !contains(github.event.head_commit.message, '[final-deps-lock]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/issue-141-ci-supply-chain

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Refresh remaining vulnerable dependencies
        run: |
          npm pkg set 'dependencies.@fastify/swagger-ui=^6.1.1'
          npm install --package-lock-only --ignore-scripts
          npm update tar-fs --package-lock-only --ignore-scripts

      - name: Commit generated manifest and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes generated.'
            exit 0
          fi
          git commit -m 'chore: eliminate remaining high runtime advisories [final-deps-lock]'
          git push origin HEAD:feat/issue-141-ci-supply-chain

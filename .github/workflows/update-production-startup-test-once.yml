name: Update Production Startup Test Once

on:
  push:
    branches:
      - feat/issue-141-ci-supply-chain

permissions:
  contents: write

jobs:
  update-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-141-ci-supply-chain

      - name: Align stale production startup assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/production/infrastructure.test.ts')
          text = path.read_text()
          old = """      // Should run migrations on startup\n      expect(prodCompose).toContain('npm run db:migrate');\n      expect(prodCompose).toContain('npm start');"""
          new = """      // Production runtime removes package managers, so startup uses compiled Node entry points.\n      expect(prodCompose).toContain('node dist/db/migrate.js');\n      expect(prodCompose).toContain('node dist/server.js');\n      expect(prodCompose).not.toMatch(/\\bnpm\\b/);"""
          if old not in text:
              raise SystemExit('expected stale startup assertions not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify formatting
        run: npx --yes prettier@3.6.2 --check tests/production/infrastructure.test.ts

      - name: Commit updated assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/production/infrastructure.test.ts
          git commit -m "test: align production startup assertion with runtime"
          git push origin HEAD:feat/issue-141-ci-supply-chain

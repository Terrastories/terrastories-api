# =============================================================================
# NGINX CONFIGURATION - PRODUCTION
# Reverse proxy with SSL termination, security headers, and performance optimization
# =============================================================================

# Main nginx configuration
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Events block - connection processing
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# Main HTTP configuration
http {
    # Basic Settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version for security
    
    # Buffer sizes
    # Largest V2 request: 100 MiB media/import caps (media-v2.ts, imports.ts) plus headroom
    client_max_body_size 128M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=2r/s;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # No http- or server-level add_header: nginx inherits those into the proxied
    # /v2/ locations, where they would duplicate or contradict the Hono API's
    # own security headers. Headers are set only on locations nginx answers
    # itself (see `location /` and `/tiles/`) (#138).
    
    # Upstream API server
    upstream api {
        server api:3001;
        keepalive 32;
    }
    
    # Upstream tile server
    upstream tileserver {
        server tileserver:8080;
        keepalive 8;
    }
    
    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
    
    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;
        
        # SSL certificates
        ssl_certificate /etc/ssl/terrastories.crt;
        ssl_certificate_key /etc/ssl/terrastories.key;
        ssl_dhparam /etc/ssl/dhparam.pem;
        
        # HSTS is set only on locations nginx answers itself. Proxied /v2/
        # responses carry the Hono API's own header set (one layer per
        # response): never add_header at server level, it would be inherited by
        # those locations and duplicate or contradict the API's headers (#138).
        # Root location - serve static files or redirect to API
        location / {
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 302 /v2/bootstrap;
        }
        
        # V2 media uploads stream to the API (cap enforced by the API, 100 MiB).
        location /v2/media {
            error_page 400 = @v2_400;
            error_page 408 = @v2_408;
            error_page 413 = @v2_413;
            error_page 502 = @v2_502;
            error_page 503 = @v2_503;
            error_page 504 = @v2_504;
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # V2 (Hono) API: bootstrap, auth, communities, media, exports.
        location /v2/ {
            error_page 400 = @v2_400;
            error_page 408 = @v2_408;
            error_page 413 = @v2_413;
            error_page 502 = @v2_502;
            error_page 503 = @v2_503;
            error_page 504 = @v2_504;
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # nginx-generated failures on proxied /v2/ (rate limit, oversized body,
        # upstream down) never reach the Hono API, so these named locations
        # supply the same baseline headers its middleware would (#138). One per
        # status so each keeps its own code. Upstream responses, including the
        # API's own errors, pass through unchanged. 400/408 apply only where
        # nginx has already selected this location; failures before routing
        # (malformed request line) still use nginx's default page.
        location @v2_400 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 400 '{"error":"Bad request"}';
        }

        location @v2_408 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 408 '{"error":"Request timeout"}';
        }

        location @v2_413 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 413 '{"error":"Request too large"}';
        }

        location @v2_502 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 502 '{"error":"Service unavailable"}';
        }

        location @v2_503 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 503 '{"error":"Service unavailable"}';
        }

        location @v2_504 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 504 '{"error":"Service unavailable"}';
        }

        # Tile server proxy
        location /tiles/ {
            proxy_pass http://tileserver/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Cache tiles for performance
            expires 1d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Lets the API see https and emit its own HSTS (one layer).
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Security: Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ \.(env|config|ini|log|bak)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
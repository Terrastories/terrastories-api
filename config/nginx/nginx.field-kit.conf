# =============================================================================
# NGINX CONFIGURATION - FIELD KIT
# Simplified configuration for offline field deployment
# No SSL, optimized for low-resource environments
# =============================================================================

user nginx;
worker_processes 1;  # Single process for low-resource devices
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;  # Reduced for field deployment
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Basic optimizations
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;  # Shorter timeout
    server_tokens off;
    
    # Smaller buffers for resource constraints
    # Largest V2 request: 100 MiB media/import caps (media-v2.ts, imports.ts) plus headroom
    client_max_body_size 128M;
    client_body_buffer_size 64k;
    
    # Light compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 3;  # Lower compression for CPU savings
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml;
    
    # Simple logging
    log_format simple '$remote_addr - $request_time - "$request" $status';
    access_log /var/log/nginx/access.log simple;
    
    # Basic rate limiting
    limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;
    
    # Upstream servers
    upstream api {
        server api:3001;
    }
    
    upstream tileserver {
        server tileserver:8080;
    }
    
    # Main HTTP server (no HTTPS in field deployment)
    server {
        listen 80;
        server_name _;
        
        # No server-level add_header: it would be inherited by the proxied /v2/
        # locations and duplicate or contradict the Hono API's own security
        # headers (X-Frame-Options DENY etc.). nginx adds headers only on
        # responses it answers itself (#138).
        # Root redirect
        location / {
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            return 302 /v2/bootstrap;
        }
        
        # V2 media uploads stream to the API (cap enforced by the API, 100 MiB).
        location /v2/media {
            error_page 400 = @v2_400;
            error_page 408 = @v2_408;
            error_page 413 = @v2_413;
            error_page 502 = @v2_502;
            error_page 503 = @v2_503;
            error_page 504 = @v2_504;
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # V2 (Hono) API: bootstrap, auth, communities, media, exports.
        location /v2/ {
            error_page 400 = @v2_400;
            error_page 408 = @v2_408;
            error_page 413 = @v2_413;
            error_page 502 = @v2_502;
            error_page 503 = @v2_503;
            error_page 504 = @v2_504;
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # nginx-generated failures on proxied /v2/ (rate limit, oversized body,
        # upstream down) never reach the Hono API, so these named locations
        # supply the same baseline headers its middleware would (#138). One per
        # status so each keeps its own code. Upstream responses, including the
        # API's own errors, pass through unchanged. 400/408 apply only where
        # nginx has already selected this location; failures before routing
        # (malformed request line) still use nginx's default page.
        location @v2_400 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            return 400 '{"error":"Bad request"}';
        }

        location @v2_408 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            return 408 '{"error":"Request timeout"}';
        }

        location @v2_413 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            return 413 '{"error":"Request too large"}';
        }

        location @v2_502 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            return 502 '{"error":"Service unavailable"}';
        }

        location @v2_503 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            return 503 '{"error":"Service unavailable"}';
        }

        location @v2_504 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            return 504 '{"error":"Service unavailable"}';
        }

        # Tile server - critical for offline maps
        location /tiles/ {
            proxy_pass http://tileserver/;
            proxy_set_header Host $host;
            
            # Long cache for tiles in offline mode
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff always;
        }
        
        # Health check
        location /health {
            access_log off;
            proxy_pass http://api/health;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Block sensitive files
        location ~ /\. {
            deny all;
        }
    }
}
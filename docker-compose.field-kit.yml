# =============================================================================
# TERRASTORIES API - FIELD KIT OVERRIDE
# Offline-optimized configuration for remote Indigenous community deployment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.field-kit.yml up -d
# =============================================================================

services:
  # =============================================================================
  # API SERVICE - Field Kit Configuration
  # =============================================================================
  api:
    build:
      target: production
    # Named so the backup service below runs the same image (node + sqlite).
    image: terrastories-api:field-kit
    environment:
      - NODE_ENV=field-kit
      # V2 (Hono) runtime gate. field-kit mode requires https unless the
      # trusted-LAN plain-HTTP exception is opted into (SPEC-V2 Section 7).
      # The bundled nginx serves plain HTTP on :80, so the exception defaults
      # on and HONO_PUBLIC_ORIGIN must be the http:// address clients use (for
      # example http://192.168.4.1). For TLS, terminate it in front of nginx,
      # set an https:// origin and HONO_ALLOW_PLAIN_HTTP=false.
      - HONO_HOST=0.0.0.0
      - HONO_PORT=3001
      - HONO_STORAGE_ROOT=/app/uploads
      # Erasure records: dedicated volume, never backed up or restored
      # (src/services/ERASURE-OPERATIONS.md).
      - ERASURE_RECORDS_ROOT=/app/erasure-records
      - HONO_PUBLIC_ORIGIN=${HONO_PUBLIC_ORIGIN:?HONO_PUBLIC_ORIGIN is required}
      - HONO_CORS_ORIGINS=${HONO_CORS_ORIGINS:-}
      - HONO_ALLOW_PLAIN_HTTP=${HONO_ALLOW_PLAIN_HTTP:-true}
      - AUTH_SERVER_SECRET=${AUTH_SERVER_SECRET:?AUTH_SERVER_SECRET is required}
      - BOOTSTRAP_SECRET=${BOOTSTRAP_SECRET:?BOOTSTRAP_SECRET is required}
      # nginx overwrites X-Forwarded-For/X-Real-IP; trust it for per-IP throttles.
      - TRUSTED_PROXY=true
      - TRUSTED_PROXY_HEADER=x-real-ip
      # Shared legacy config loader (src/shared/config) still requires these.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - LOG_LEVEL=warn
      - HOT_RELOAD=false
      # Enable offline mode
      - OFFLINE_MODE=true
      - FIELD_KIT_MODE=true
      # Use local tile server
      - TILE_SERVER_URL=http://tileserver:8080
      # Disable remote sync endpoint for offline
      - SYNC_ENDPOINT=
      # Use SQLite for simplicity in field deployment
      # Same path as before the V2 switch, so an upgrade reopens the existing
      # database instead of silently creating an empty one with bootstrap open.
      - DATABASE_URL=./data/field-kit.db
    # No host port: nginx (:80) is the only entry. TRUSTED_PROXY=true makes the
    # API believe X-Real-IP, so a directly reachable API port would let LAN
    # clients spoof it and bypass the per-IP throttles.
    ports: !reset []
    # Resource constraints for low-power hardware
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    # Field kit specific volumes
    volumes:
      - field_kit_data:/app/data
      - uploads_data:/app/uploads
      - erasure_records:/app/erasure-records
    # Healthcheck with longer intervals for low-power devices
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/health',
        ]
      interval: 60s
      timeout: 30s
      retries: 2
      start_period: 60s

  # =============================================================================
  # DATABASE SERVICE - Field Kit Configuration
  # PostgreSQL service disabled - using SQLite for field deployments
  # Uncomment below if PostgreSQL is needed instead of SQLite
  # =============================================================================
  # db:
  #   # Remove public port exposure for security
  #   ports: []
  #   environment:
  #     # Use simpler password for field deployment
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fieldkit123}
  #   # Minimal resource allocation
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.3'
  #         memory: 128M
  #       reservations:
  #         cpus: '0.1'
  #         memory: 64M
  #   restart: unless-stopped
  #   # Optimized for low-resource deployment
  #   command: >
  #     postgres
  #     -c max_connections=20
  #     -c shared_buffers=32MB
  #     -c effective_cache_size=64MB
  #     -c maintenance_work_mem=16MB
  #     -c checkpoint_completion_target=0.9
  #     -c wal_buffers=4MB
  #     -c default_statistics_target=50

  # =============================================================================
  # TILE SERVER SERVICE - Field Kit Configuration
  # Critical for offline map functionality
  # =============================================================================
  tileserver:
    # Keep port accessible for direct map access
    ports:
      - '8080:8080'
    # Minimal resources but still functional
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped
    # Field kit optimized tile configuration
    volumes:
      - ./tiles:/data/tiles:ro
      - ./config/tileserver/config.field-kit.json:/data/config.json:ro
    environment:
      # Reduce file watching overhead
      - CHOKIDAR_USEPOLLING=false

  # =============================================================================
  # NGINX SERVICE - Simplified for Field Kit
  # Lightweight configuration without SSL complexity
  # =============================================================================
  nginx:
    image: nginx:1.21-alpine
    ports:
      - '80:80'
    volumes:
      # Simplified Nginx configuration
      - ./config/nginx/nginx.field-kit.conf:/etc/nginx/nginx.conf:ro
      # No uploads/erasure volume here: V2 media is protected and is served only
      # by the API (authenticated /v2/ routes), never directly by nginx.
    environment:
      - API_HOST=api
      - API_PORT=3001
      - TILE_SERVER_HOST=tileserver
      - TILE_SERVER_PORT=8080
    depends_on:
      - api
      - tileserver
    networks:
      - terrastories-network
    restart: unless-stopped
    # Minimal resources for Nginx
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    # Simple health check
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost/health',
        ]
      interval: 60s
      timeout: 30s
      retries: 2

  # =============================================================================
  # FIELD KIT SERVICES - Offline-specific functionality
  # =============================================================================

  # Hosted/field-kit sync has no approved protocol or runnable entrypoint.
  # No sync-service or sync-enabled profile is provided; design: #182.
  # SPEC-V2 Section 5 does not require synchronization for launch.

  # Backup service optimized for field conditions
  field-backup:
    # The app image (Alpine, BusyBox sh, node + better-sqlite3): the script is
    # POSIX sh and takes a consistent online copy of the live database.
    image: terrastories-api:field-kit
    user: root # crond needs root; the data and upload mounts are read-only
    entrypoint: []
    working_dir: /app
    depends_on:
      - api
    volumes:
      - field_kit_data:/data:ro
      - uploads_data:/uploads:ro
      - field_kit_backups:/backups
      - ./scripts/field-kit-backup.sh:/backup.sh:ro
      - ./scripts/ops/sqlite-backup.mjs:/app/sqlite-backup.mjs:ro
    environment:
      - BACKUP_RETENTION_DAYS=3 # Limited storage in field
      - BACKUP_COMPRESSION=true
      - SQLITE_BACKUP_HELPER=/app/sqlite-backup.mjs
    # Run backup twice daily due to limited connectivity windows
    command: >
      sh -c "
      echo '0 6,18 * * * /backup.sh' | crontab - &&
      crond -f -l 2
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

# =============================================================================
# FIELD KIT-SPECIFIC VOLUMES
# =============================================================================
volumes:
  # Field kit application data (SQLite databases, etc.)
  field_kit_data:
    driver: local

  # Upload files storage (inherited from base configuration)
  uploads_data:
    driver: local

  # Erasure records (SPEC-V2 Section 7): never included in any backup.
  erasure_records:
    driver: local

  # Local backups with limited retention
  field_kit_backups:
    driver: local

# =============================================================================
# FIELD KIT NETWORK CONFIGURATION
# Optimized for offline operation
# =============================================================================
networks:
  terrastories-network:
    driver: bridge
    # Use smaller subnet to reduce overhead
    ipam:
      config:
        - subnet: 172.21.0.0/24
